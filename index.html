<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Letter</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="envelope" id="envelope">
        <div class="flap">
            <div class="flap-front"></div>
        </div>
        <div class="body"></div>
        <div class="click-hint">Click to open 💌</div>

        <!-- Move the letter inside the envelope so it can be positioned relative to it -->
        <div class="letter" id="letter">
            <p>Hi baby! Can you be my Valentine's date this Thursday?</p>
            <div class="buttons">
                <button id="yes">Yes</button>
                <button id="no">No</button>
            </div>
        </div>
    </div>
    <div class="popup" id="popup">
        <p id="popup-message"></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
